services:
  autojudge:
    build: .
    ports:
      - "9000:9000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Pre-built sandbox with pytest for code execution verification
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: autojudge-sandbox:latest
    command: ["sleep", "infinity"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  redis_data:
